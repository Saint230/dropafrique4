<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropAfrique – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--noir:#0D0D0D;--blanc:#FAFAF8;--creme:#F5F0E8;--terre:#C4883A;--gc:#E8E4DC;--gm:#B8B0A4;--gt:#5C5650;--vert:#3D5A47;--rouge:#C0392B;--bleu:#2980b9}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',sans-serif;background:var(--creme);color:var(--noir);min-height:100vh}

/* LOGIN */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--noir);padding:20px}
.login-box{background:var(--blanc);border-radius:16px;padding:40px 32px;width:100%;max-width:360px;text-align:center}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;margin-bottom:6px}
.login-logo em{font-style:italic;color:var(--terre)}
.login-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gm);margin-bottom:32px}
.login-label{display:block;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gt);margin-bottom:8px;text-align:left}
.login-input{width:100%;padding:14px 16px;border:1px solid var(--gc);border-radius:4px;font-family:'Jost',sans-serif;font-size:15px;outline:none;transition:border-color .2s;margin-bottom:16px}
.login-input:focus{border-color:var(--noir)}
.login-btn{width:100%;background:var(--noir);color:var(--blanc);border:none;border-radius:4px;padding:15px;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .2s}
.login-btn:hover{background:#222}
.login-err{color:var(--rouge);font-size:12px;margin-top:10px;display:none}

/* DASHBOARD */
.dash{display:none}
.dash-header{background:var(--noir);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.dash-logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--blanc)}
.dash-logo em{font-style:italic;color:var(--terre)}
.dash-right{display:flex;align-items:center;gap:12px}
.dash-date{font-size:11px;color:rgba(250,250,248,.4);letter-spacing:1px}
.logout-btn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(250,250,248,.6);border-radius:4px;padding:6px 12px;font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:var(--rouge);color:var(--rouge)}

/* KPI CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:20px 16px 0}
.kpi{background:var(--blanc);border-radius:12px;padding:18px 16px;border:1px solid var(--gc)}
.kpi-val{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;line-height:1;margin-bottom:4px}
.kpi-val.green{color:var(--vert)}
.kpi-val.terre{color:var(--terre)}
.kpi-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gm)}

/* COMMANDES */
.section-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;font-style:italic;padding:24px 16px 12px}
.filters{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;background:var(--blanc);border:1px solid var(--gc);border-radius:20px;padding:7px 14px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.filter-btn.active{background:var(--noir);color:var(--blanc);border-color:var(--noir)}

.cmd-list{padding:0 16px 100px}
.cmd-empty{text-align:center;padding:40px 20px;color:var(--gm)}
.cmd-empty-ico{font-size:40px;opacity:.3;margin-bottom:10px}

.cmd-card{background:var(--blanc);border-radius:12px;border:1px solid var(--gc);margin-bottom:12px;overflow:hidden;transition:box-shadow .2s}
.cmd-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.cmd-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
.cmd-ref{font-size:13px;font-weight:600;color:var(--noir)}
.cmd-date{font-size:11px;color:var(--gm)}
.cmd-client{padding:0 16px 10px;font-size:13px;color:var(--gt)}
.cmd-client strong{color:var(--noir);font-weight:500}
.cmd-articles{padding:0 16px 10px;font-size:12px;color:var(--gt);line-height:1.7;border-top:1px solid var(--gc);padding-top:10px}
.cmd-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--creme);border-top:1px solid var(--gc)}
.cmd-total{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--terre)}
.cmd-status{display:flex;align-items:center;gap:6px}
.status-badge{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:20px}
.status-badge.pending{background:#FEF3C7;color:#92400E}
.status-badge.delivered{background:#D1FAE5;color:#065F46}
.status-badge.cancelled{background:#FEE2E2;color:#991B1B}
.status-toggle{background:none;border:1px solid var(--gc);border-radius:4px;padding:5px 10px;font-family:'Jost',sans-serif;font-size:10px;cursor:pointer;transition:all .2s}
.status-toggle:hover{background:var(--gc)}

/* ZONE/PAY BADGES */
.meta-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.meta-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500}
.meta-badge.zone{background:#EDE9FE;color:#5B21B6}
.meta-badge.pay{background:#DBEAFE;color:#1E40AF}
.meta-badge.note{background:#F3F4F6;color:#374151}

/* EXPORT */
.export-btn{display:flex;align-items:center;gap:8px;background:var(--vert);color:white;border:none;border-radius:8px;padding:12px 20px;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;cursor:pointer;margin:0 16px 16px;letter-spacing:1px;transition:opacity .2s}
.export-btn:hover{opacity:.9}

/* NOUVELLE COMMANDE INDICATOR */
.new-indicator{background:var(--rouge);color:white;border-radius:50%;width:8px;height:8px;display:inline-block;margin-left:6px;animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <div class="login-logo">Drop<em>Afrique</em></div>
    <div class="login-sub">Dashboard Admin</div>
    <label class="login-label">Mot de passe</label>
    <input class="login-input" type="password" id="pwInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Accéder au dashboard</button>
    <div class="login-err" id="loginErr">❌ Mot de passe incorrect</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dash">
  <div class="dash-header">
    <div class="dash-logo">Drop<em>Afrique</em></div>
    <div class="dash-right">
      <span class="dash-date" id="dashDate"></span>
      <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-val terre" id="kpi-total">0 €</div>
      <div class="kpi-label">Chiffre d'affaires</div>
    </div>
    <div class="kpi">
      <div class="kpi-val" id="kpi-count">0</div>
      <div class="kpi-label">Commandes totales</div>
    </div>
    <div class="kpi">
      <div class="kpi-val green" id="kpi-delivered">0</div>
      <div class="kpi-label">Livrées</div>
    </div>
    <div class="kpi">
      <div class="kpi-val" id="kpi-pending">0</div>
      <div class="kpi-label">En attente</div>
    </div>
  </div>

  <!-- COMMANDES -->
  <div class="section-title">Commandes reçues</div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="applyFilter('all',this)">Toutes</button>
    <button class="filter-btn" data-filter="pending" onclick="applyFilter('pending',this)">En attente</button>
    <button class="filter-btn" data-filter="delivered" onclick="applyFilter('delivered',this)">Livrées</button>
    <button class="filter-btn" data-filter="cancelled" onclick="applyFilter('cancelled',this)">Annulées</button>
  </div>

  <button class="export-btn" onclick="exportCSV()">
    📥 Exporter en Excel / CSV
  </button>

  <div class="cmd-list" id="cmdList"></div>
</div>

<script>
// ── MOT DE PASSE ──
var PASS = "dropafrique2024";

function doLogin(){
  var pw = document.getElementById("pwInput").value;
  if(pw === PASS){
    sessionStorage.setItem("da_auth","1");
    showDash();
  } else {
    document.getElementById("loginErr").style.display="block";
    document.getElementById("pwInput").value="";
  }
}

function doLogout(){
  sessionStorage.removeItem("da_auth");
  document.getElementById("dash").style.display="none";
  document.getElementById("loginPage").style.display="flex";
  document.getElementById("pwInput").value="";
}

function showDash(){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("dash").style.display="block";
  updateDate();
  loadOrders();
}

// ── DATE ──
function updateDate(){
  var now = new Date();
  var opts = {weekday:'long',day:'numeric',month:'long',year:'numeric'};
  document.getElementById("dashDate").textContent = now.toLocaleDateString('fr-FR',opts);
}

// ── COMMANDES (localStorage) ──
function getOrders(){
  try{ return JSON.parse(localStorage.getItem("da_orders")||"[]"); }
  catch(e){ return []; }
}

function saveOrders(orders){
  localStorage.setItem("da_orders", JSON.stringify(orders));
}

// ── AJOUTER UNE COMMANDE (appelé depuis le catalogue via postMessage) ──
window.addEventListener("message", function(e){
  if(e.data && e.data.type === "NEW_ORDER"){
    var orders = getOrders();
    orders.unshift(e.data.order);
    saveOrders(orders);
  }
});

// Aussi écouter le storage event (quand le catalogue écrit directement)
window.addEventListener("storage", function(e){
  if(e.key === "da_orders") loadOrders();
});

// ── FILTRES ──
var currentFilter = "all";

function applyFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  renderOrders(getOrders());
}

// ── RENDER ──
function loadOrders(){
  renderOrders(getOrders());
  updateKPIs(getOrders());
}

function renderOrders(orders){
  var list = document.getElementById("cmdList");
  var filtered = orders.filter(function(o){
    if(currentFilter==="all") return true;
    return o.status === currentFilter;
  });

  if(!filtered.length){
    list.innerHTML = '<div class="cmd-empty"><div class="cmd-empty-ico">📋</div><p style="font-size:14px;font-weight:300">Aucune commande '+(currentFilter==="all"?"pour l\'instant":"dans cette catégorie")+'</p></div>';
    return;
  }

  list.innerHTML = "";
  filtered.forEach(function(o, idx){
    var card = document.createElement("div");
    card.className = "cmd-card";

    var statusLabel = o.status==="delivered"?"✅ Livrée":o.status==="cancelled"?"❌ Annulée":"⏳ En attente";
    var statusClass = o.status==="delivered"?"delivered":o.status==="cancelled"?"cancelled":"pending";

    var nextStatus = o.status==="pending"?"delivered":o.status==="delivered"?"cancelled":"pending";
    var nextLabel = o.status==="pending"?"Marquer livrée":o.status==="delivered"?"Annuler":"Remettre en attente";

    card.innerHTML =
      '<div class="cmd-head">' +
        '<span class="cmd-ref">#'+o.ref+'</span>' +
        '<span class="cmd-date">'+o.date+'</span>' +
      '</div>' +
      '<div class="cmd-client"><strong>'+o.nom+'</strong> · '+o.tel+'<br>📍 '+o.adresse+'</div>' +
      '<div class="meta-row">' +
        '<span class="meta-badge zone">'+o.zone+'</span>' +
        '<span class="meta-badge pay">'+o.paiement+'</span>' +
        (o.note?'<span class="meta-badge note">📝 '+o.note+'</span>':'') +
      '</div>' +
      '<div class="cmd-articles">'+o.articles.replace(/\n/g,"<br>")+'</div>' +
      '<div class="cmd-footer">' +
        '<span class="cmd-total">'+parseFloat(o.total).toFixed(2)+' €</span>' +
        '<div class="cmd-status">' +
          '<span class="status-badge '+statusClass+'">'+statusLabel+'</span>' +
          '<button class="status-toggle" onclick="changeStatus('+orders.indexOf(o)+',\''+nextStatus+'\')">'+nextLabel+'</button>' +
        '</div>' +
      '</div>';

    list.appendChild(card);
  });
}

function updateKPIs(orders){
  var total = orders.reduce(function(s,o){ return s+parseFloat(o.total||0); },0);
  var delivered = orders.filter(function(o){ return o.status==="delivered"; }).length;
  var pending = orders.filter(function(o){ return o.status==="pending"; }).length;
  document.getElementById("kpi-total").textContent = total.toFixed(2)+" €";
  document.getElementById("kpi-count").textContent = orders.length;
  document.getElementById("kpi-delivered").textContent = delivered;
  document.getElementById("kpi-pending").textContent = pending;
}

function changeStatus(idx, newStatus){
  var orders = getOrders();
  if(orders[idx]){ orders[idx].status = newStatus; saveOrders(orders); loadOrders(); }
}

// ── EXPORT CSV ──
function exportCSV(){
  var orders = getOrders();
  if(!orders.length){ alert("Aucune commande à exporter."); return; }
  var rows = [["Réf","Date","Nom","Téléphone","Adresse","Zone","Paiement","Articles","Total","Statut","Note"]];
  orders.forEach(function(o){
    rows.push([o.ref,o.date,o.nom,o.tel,o.adresse,o.zone,o.paiement,'"'+o.articles.replace(/"/g,'""')+'"',o.total,o.status,o.note||""]);
  });
  var csv = rows.map(function(r){ return r.join(";"); }).join("\n");
  var blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href=url; a.download="commandes_dropafrique.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ── INIT ──
if(sessionStorage.getItem("da_auth")==="1"){
  showDash();
}

// ── COMMANDES DE TEST (à supprimer en production) ──
// Décommenter pour voir des données de démo :

  saveOrders([
    {ref:"DA-001",date:"06/06/2026 14:32",nom:"Marie Diallo",tel:"06 12 34 56 78",adresse:"12 rue de la Paix, 93100 Montreuil",zone:"🚗 Île-de-France",paiement:"💵 Cash",articles:"• Beurre de Karité x2 = 25.80€\n• Bissap x1 = 6.90€",total:"32.70",status:"pending",note:""},
    {ref:"DA-002",date:"05/06/2026 10:15",nom:"Fatou Ndiaye",tel:"07 98 76 54 32",adresse:"5 avenue Victor Hugo, 75016 Paris",zone:"🚗 Île-de-France",paiement:"📱 Virement",articles:"• Attiéké x3 = 19.50€\n• Manioc x1 = 5.90€\n• Gombo x2 = 11.00€",total:"36.40",status:"delivered",note:"Appeler avant de venir"}
  ]);
}
*/
</script>
</body>
</html>
